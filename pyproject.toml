[project]
name = "rlnf"
version = "0.1.0"
description = "Reward hacking in RL from Neural Feedback: a minimal gridworld simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rlnf"]
